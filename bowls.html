<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Feast — Healthy Bowls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen" id="screen">

    <div class="main-content">

      <!-- ── Left: Hero Slideshow ── -->
      <div class="hero-panel">
        <div class="hero-slides" id="heroSlides">
          <!-- injected by JS -->
        </div>
        <div class="hero-dots" id="heroDots"></div>
      </div>

      <!-- ── Right: Bowl Grid ── -->
      <div class="grid-panel">
        <div class="grid-header">
          <h1 class="grid-title">Healthy Bowls</h1>
        </div>
        <div class="bowl-grid" id="bowlGrid">
          <!-- injected by JS -->
        </div>
      </div>

    </div><!-- /.main-content -->

    <!-- ── Upsell Rail ── -->
    <div class="upsell-rail" id="upsellRail">
      <!-- injected by JS -->
    </div>

    <!-- ── Footer Strip ── -->
    <div class="footer-strip">
      <div class="footer-legend">
        <span class="legend-item"><span class="legend-tag">V</span> Vegan</span>
        <span class="legend-dot">·</span>
        <span class="legend-item"><span class="legend-tag">GF</span> Gluten Free</span>
      </div>
      <div class="footer-note">Macros per serving with paneer</div>
      <div class="footer-wordmark">Green&nbsp;Feast</div>
    </div>

  </div><!-- /.screen -->

  <script src="script.js"></script>
</body>
</html>
