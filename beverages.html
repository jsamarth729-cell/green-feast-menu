<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Green Feast — Beverages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Montserrat:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core.css?v=2">
  <link rel="stylesheet" href="beverages.css?v=2">
</head>
<body>
  <div class="screen" id="screen">

    <div class="main-content">
      <div class="bev-columns">

        <div class="bev-col bev-col--smoothies">
          <div class="section-header section-header--smoothies">
            <div class="section-title" id="smoothieHeading"><!-- injected by JS --></div>
            <span class="bev-section-note" id="smoothieNote"><!-- injected by JS --></span>
          </div>
          <div class="smoothie-grid" id="smoothieRow">
            <!-- injected by JS -->
          </div>
        </div>

        <div class="bev-col bev-col--coffee">
          <div class="section-header section-header--coffee">
            <div class="section-title" id="coffeeHeading"><!-- injected by JS --></div>
          </div>
          <div class="coffee-grid" id="coffeeRow">
            <!-- injected by JS -->
          </div>
        </div>

      </div><!-- /.bev-columns -->
    </div><!-- /.main-content -->

    <!-- ── Offers Panel — Screen 3 only ──────────────────────────
         Fades in over the coffee column on a 30s/15s cycle. Lives
         here — a direct child of .screen, out of flow — rather than
         inside #coffeeRow, because render() rewrites #coffeeRow's
         innerHTML every 5 minutes and would destroy it. Must stay
         after .main-content and before .upsell-rail: that DOM order
         is what gives the correct paint stacking with no z-index. -->
    <div class="offers-panel" id="offersPanel">
      <div class="offers-title" id="offersTitle"><!-- injected by JS --></div>
      <div class="offers-sweetener" id="offersSweetener"><!-- injected by JS --></div>
      <div class="offers-chip" id="offersChip"><!-- injected by JS --></div>
      <div class="offers-eyebrow" id="offersEyebrow"><!-- injected by JS --></div>
      <div class="offers-art">
        <!-- No src attribute here on purpose: src="" makes the browser
             request the current page as an image, which fails instantly
             and fires onerror before JS ever assigns the real src —
             removing this element before renderOffersPanel() runs.
             JS sets src for the first time in renderOffersPanel(). -->
        <img id="offersImage" alt=""
             onerror="this.closest('.offers-art').classList.add('photo-error');this.remove()">
      </div>
      <div class="offers-credit" id="offersCredit"><!-- injected by JS --></div>
      <div class="offers-items" id="offersItems"><!-- injected by JS --></div>
    </div>

    <!-- ── Upsell Rail ── -->
    <div class="upsell-rail" id="upsellRail">
      <!-- injected by JS -->
    </div>

    <!-- ── Footer Strip ── -->
    <div class="footer-strip">
      <div class="footer-legend">
        <span class="legend-item"><span class="legend-tag">GF</span> Gluten Free</span>
        <span class="legend-item"><span class="legend-tag">PRO</span> High Protein</span>
        <span class="legend-item"><span class="legend-tag">FIB</span> High Fibre</span>
        <span class="legend-item"><span class="legend-tag">N</span> Contains Nuts</span>
        <span class="legend-item"><span class="legend-tag">LS</span> Less Spicy</span>
      </div>
      <div class="footer-wordmark">Green&nbsp;Feast</div>
    </div>

  </div><!-- /.screen -->

  <script src="core.js?v=2"></script>
  <script src="beverages.js?v=2"></script>
</body>
</html>
