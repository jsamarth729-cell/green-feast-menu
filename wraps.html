<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Green Feast — Wraps &amp; Paninis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="core.css">
  <link rel="stylesheet" href="wraps.css">
</head>
<body>
  <div class="screen" id="screen">

    <div class="main-content">

      <!-- ── Left: Panini feature panel (static, no slideshow) ── -->
      <div class="panini-panel">
        <div class="panini-header" id="paniniHeader">
          <!-- injected by JS -->
        </div>
        <div class="panini-list" id="paniniList">
          <!-- injected by JS -->
        </div>
        <div class="panini-stats" id="paniniStats">
          <!-- injected by JS -->
        </div>
        <div class="panini-photo-wrap" id="paniniPhoto">
          <!-- injected by JS -->
        </div>
      </div>

      <!-- ── Right: category blocks ── -->
      <div class="content-panel">

        <div class="section-header section-header--toasts">
          <h1 class="section-title">Open Toasts</h1>
        </div>
        <div class="toast-grid" id="toastGrid">
          <!-- injected by JS -->
        </div>

        <div class="section-header section-header--wraps">
          <h1 class="section-title">Wraps</h1>
        </div>
        <div class="wrap-block">
          <div class="wrap-list" id="wrapList">
            <!-- injected by JS -->
          </div>
          <div class="wrap-photo-wrap" id="wrapPhoto">
            <!-- injected by JS -->
          </div>
        </div>

      </div><!-- /.content-panel -->

    </div><!-- /.main-content -->

    <!-- ── Upsell Rail ── -->
    <div class="upsell-rail" id="upsellRail">
      <!-- injected by JS -->
    </div>

    <!-- ── Footer Strip ── -->
    <div class="footer-strip">
      <div class="footer-legend">
        <span class="legend-item"><span class="legend-tag">GF</span> Gluten Free</span>
        <span class="legend-item"><span class="legend-tag">PRO</span> High Protein</span>
        <span class="legend-item"><span class="legend-tag">FIB</span> High Fibre</span>
        <span class="legend-item"><span class="legend-tag">N</span> Contains Nuts</span>
        <span class="legend-item"><span class="legend-tag">LS</span> Less Spicy</span>
      </div>
      <div class="footer-wordmark">Green&nbsp;Feast</div>
    </div>

  </div><!-- /.screen -->

  <script src="core.js"></script>
  <script src="wraps.js"></script>
</body>
</html>
